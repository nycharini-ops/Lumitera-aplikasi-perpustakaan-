        body::after {

        #app { background: transparent; }
        /* halaman login / daftar: gambar terlihat penuh, kartu kaca */
        .auth-wrap { background: transparent !important; }
        .auth-card { background: rgba(255,255,255,.92) !important; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-color: rgba(255,255,255,.4) !important; }
        /* dashboard: lapisan krem agar tabel/teks tetap terbaca */
        .dash-wrap { background: rgba(255,249,242,.90) !important; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
        .dash-wrap > header { background: rgba(255,255,255,.85) !important; }

        /* ===== Pop up transparan (kaca) tapi tetap kontras ===== */
        .pop-overlay { background: rgba(20,8,5,.28); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
        .glass-pop {
            background: rgba(255,252,247,.76) !important;
            -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
            border: 1px solid rgba(255,255,255,.55);
            box-shadow: 0 20px 50px rgba(20,8,5,.35) !important;

        .glass-pop h3, .glass-pop label { color: #0f172a !important; }
        .glass-pop p, .glass-pop .text-slate-600, .glass-pop .text-slate-500 { color: #1e293b !important; }
        .glass-pop input, .glass-pop select, .glass-pop textarea { background: rgba(255,255,255,.92) !important; color: #0f172a !important; border-color: #94a3b8 !important; }
        .glass-pop .bg-slate-100 { background: rgba(255,255,255,.85) !important; color: #0f172a !important; }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass-pop { background: rgba(255,252,247,.96) !important; } }

        /* ===== Revisi: semua permukaan putih jadi kaca transparan ===== */

    <script>

        // ---------- Helper: penyimpanan aman (iOS private mode / kuota penuh) ----------
        const memStore = {};
        function lsGet(k) { try { const v = localStorage.getItem(k); return v === null ? (memStore[k] ?? null) : v; } catch (e) { return memStore[k] ?? null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); delete memStore[k]; return true; } catch (e) { memStore[k] = v; return false; } }
        function lsRemove(k) { try { localStorage.removeItem(k); } catch (e) {} delete memStore[k]; }

        // ---------- Helper: escape HTML (cegah XSS dari input) ----------
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ---------- Helper: tanggal lokal (bukan UTC) ----------
        function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function parseDate(str) { const [y, m, d] = String(str).split('-').map(Number); return new Date(y, m - 1, d); }
        function startOfToday() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }


        // ---------- Kode pengembalian harian (berubah otomatis tiap hari, sama di semua perangkat) ----------
        const RETURN_CODE_SALT = 'lumitera-sman15-bandung-2026';
        function cyrb53(str, seed = 0) {
            let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
            for (let i = 0, ch; i < str.length; i++) {
                ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return 4294967296 * (2097151 & h2) + (h1 >>> 0);
        }
        function dailyReturnCode(d = new Date()) {
            const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
            let n = cyrb53('LUMITERA|' + fmtDate(d) + '|' + RETURN_CODE_SALT), code = '';
            for (let i = 0; i < 6; i++) { code += alphabet[n % alphabet.length]; n = Math.floor(n / alphabet.length); }
            return code;
        }
        function copyReturnCode() {
            const code = dailyReturnCode();
            const done = () => { const b = document.getElementById('copy-code-label'); if (b) { b.innerText = 'Tersalin!'; setTimeout(() => { b.innerText = 'Salin Kode'; }, 1500); } };
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code).then(done, done); }
            else { const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); done(); }
        }

        const STORAGE_KEY_USERS = 'lib_school_users';
        const STORAGE_KEY_BOOKS = 'lib_school_books';
        const STORAGE_KEY_BORROW = 'lib_school_borrowings';
        const STORAGE_KEY_HISTORY = 'lib_school_history';
        const STORAGE_KEY_SESSION = 'lib_school_session';

        const defaultBooks = [

            { nisn: '1234567', name: 'Budi Santoso', kelas: 'XI-IPA-1', tglLahir: '2008-05-12', password: 'password123' }
        ];

        function getDB(key, defaultVal) {
            const data = lsGet(key);
            if (!data) {
                lsSet(key, JSON.stringify(defaultVal));
                return defaultVal;
            }
            try { 
                const parsed = JSON.parse(data);
                if (key === STORAGE_KEY_BOOKS && (!Array.isArray(parsed) || parsed.length === 0)) {
                    lsSet(key, JSON.stringify(defaultVal));
                    return defaultVal;
                }
                return parsed; 
            } catch(e) { return defaultVal; }
        }

        function saveDB(key, val) {
            const ok = lsSet(key, JSON.stringify(val));
            if (!ok) {
                showModal('Penyimpanan Bermasalah', 'Data tidak dapat disimpan permanen di perangkat ini (penyimpanan penuh atau browser dalam mode privat). Data hanya bertahan selama halaman terbuka.', 'error');
            }
            return ok;

        let modalHideTimer = null;
        function showModal(title, message, type = 'info', callback = null) {
            clearTimeout(modalHideTimer);
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const iconWrap = document.getElementById('modal-icon-wrapper');
            const icon = document.getElementById('modal-icon');

            iconWrap.className = "w-10 h-10 rounded-full flex items-center justify-center " +
                (type === 'success' ? 'bg-emerald-100 text-emerald-600' : type === 'error' ? 'bg-rose-100 text-rose-600' : 'bg-indigo-100 text-indigo-600');
            icon.className = "fa-solid " + (type === 'success' ? 'fa-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-info') + " text-lg";

            const actions = document.getElementById('modal-actions');
            if (callback && type === 'info') {
                actions.innerHTML = `
                    <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm transition">Batal</button>
                    <button id="modal-confirm-btn" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm shadow-sm shadow-indigo-200 transition">Ya, Lanjutkan</button>
                `;
                document.getElementById('modal-confirm-btn').onclick = () => { closeModal(true); callback(); };
            } else if (callback) {
                actions.innerHTML = `<button id="modal-confirm-btn" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm transition shadow-sm shadow-indigo-200">OK</button>`;
                document.getElementById('modal-confirm-btn').onclick = () => { closeModal(true); callback(); };
            } else {
                actions.innerHTML = `<button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm transition shadow-sm shadow-indigo-200">Tutup</button>`;
            }

            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            modal.classList.remove('hidden');
            setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal(immediate = false) {
            clearTimeout(modalHideTimer);
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            if (immediate) { modal.classList.add('hidden'); return; }
            modalHideTimer = setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function handleRegister(e) {
            e.preventDefault();
            const nisn = document.getElementById('reg-nisn').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const kelas = document.getElementById('reg-kelas').value;
            const tglLahir = document.getElementById('reg-dob').value;
            const password = document.getElementById('reg-pass').value;
            const passConfirm = document.getElementById('reg-pass-confirm').value;

            if (password !== passConfirm) {
                showModal('Pendaftaran Gagal', 'Konfirmasi password tidak cocok dengan password.', 'error');
                return;
            }

            const users = getDB(STORAGE_KEY_USERS, defaultUsers);
            if (users.some(u => u.nisn === nisn)) {
                showModal('Pendaftaran Gagal', 'NISN tersebut sudah terdaftar dalam sistem.', 'error');
                return;
            }

            users.push({ nisn, name, kelas, tglLahir, password });
            saveDB(STORAGE_KEY_USERS, users);

            showModal('Pendaftaran Berhasil!', 'Akun Anda berhasil didaftarkan. Silakan login.', 'success', () => {
                renderLogin();
            });

        function bookCardHTML(b) {
            return `
                <div class="p-4 rounded-2xl border border-slate-200 bg-white flex space-x-4 items-start shadow-sm">

        function renderTabBorrow(container) {
            const categories = ['Semua Kategori', 'Buku Pelajaran', 'Buku Fiksi', 'Buku Non-Fiksi', 'Buku Referensi', 'Majalah & Jurnal'];

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-6">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-search"></i></span>

                    </div>
                    <div class="sm:w-64">
                        <select id="borrow-cat-filter" onchange="filterBorrowBooks()" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600">

                <div id="borrow-book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            filterBorrowBooks();

        function filterBorrowBooks() {
            const search = (document.getElementById('borrow-search')?.value || '').toLowerCase();
            const cat = document.getElementById('borrow-cat-filter')?.value || '';
            const books = getDB(STORAGE_KEY_BOOKS, defaultBooks);

            const filtered = books.filter(b => {
                const matchSearch = b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search) || b.code.toLowerCase().includes(search);
                const matchCat = !cat || b.category === cat;
                return matchSearch && matchCat;
            });

            const grid = document.getElementById('borrow-book-grid');
            if (!grid) return;
            grid.innerHTML = filtered.length === 0
                ? `<div class="col-span-full py-12 text-center text-slate-400">Tidak ada buku ditemukan.</div>`
                : filtered.map(bookCardHTML).join('');
        }

        function borrowBook(code) {
            const session = getCurrentSession();
            const books = getDB(STORAGE_KEY_BOOKS, defaultBooks);
            const bookIdx = books.findIndex(b => b.code === code);
            if (bookIdx === -1 || books[bookIdx].stock <= 0) {
                showModal('Gagal Pinjam', 'Buku tidak tersedia atau stok habis.', 'error');
                return;
            }

            const borrowings = getDB(STORAGE_KEY_BORROW, []);
            const activeUserBorrows = borrowings.filter(b => b.nisn === session.nisn && !b.returned);

                return;

                showModal('Sudah Dipinjam', 'Anda sedang meminjam buku ini. Kembalikan dulu sebelum meminjam lagi.', 'error');
                return;
            }

            const now = new Date();
            const dueDate = new Date();
            dueDate.setDate(now.getDate() + 7);

            books[bookIdx].stock -= 1;
            saveDB(STORAGE_KEY_BOOKS, books);

                studentName: session.name,

                tglPinjam: fmtDate(now),
                dueDate: fmtDate(dueDate),
                renewCount: 0,
                returned: false
            });
            saveDB(STORAGE_KEY_BORROW, borrowings);

            showModal('Peminjaman Berhasil', `Buku "${books[bookIdx].title}" berhasil dipinjam. Batas pengembalian: ${fmtDate(dueDate)}`, 'success', () => {
                renderStudentDashboard(currentStudentTab);

        let pendingReturnId = null, returnFails = 0, returnLockUntil = 0;
        function returnBook(borrowId) {
            const item = getDB(STORAGE_KEY_BORROW, []).find(b => b.id === borrowId);
            if (!item) return;
            pendingReturnId = borrowId;
            document.getElementById('return-modal-book').innerText = '"' + item.judulBuku + '"';
            document.getElementById('return-code-input').value = '';
            document.getElementById('return-code-error').innerText = '';
            document.getElementById('return-modal').classList.remove('hidden');
            setTimeout(() => { try { document.getElementById('return-code-input').focus(); } catch (e) {} }, 50);
        }
        function closeReturnModal() {
            document.getElementById('return-modal').classList.add('hidden');
            pendingReturnId = null;
        }
        function submitReturnCode() {
            const err = document.getElementById('return-code-error');
            const input = document.getElementById('return-code-input');
            const now = Date.now();
            if (now < returnLockUntil) {
                err.innerText = 'Terlalu banyak percobaan. Coba lagi dalam ' + Math.ceil((returnLockUntil - now) / 1000) + ' detik.';
                return;
            }
            const entered = input.value.trim().toUpperCase();
            if (!entered) { err.innerText = 'Kode wajib diisi.'; return; }
            if (entered !== dailyReturnCode()) {
                returnFails++;
                if (returnFails >= 5) { returnLockUntil = now + 30000; returnFails = 0; err.innerText = 'Kode salah 5 kali. Coba lagi dalam 30 detik.'; }
                else err.innerText = 'Kode salah. Minta kode hari ini kepada admin perpustakaan.';
                input.select();
                return;
            }
            returnFails = 0;
            const id = pendingReturnId;
            closeReturnModal();
            performReturn(id);
        }
        function performReturn(borrowId) {
            const borrowings = getDB(STORAGE_KEY_BORROW, []);
            const idx = borrowings.findIndex(b => b.id === borrowId);
            if (idx === -1) return;

            const item = borrowings[idx];
            item.returned = true;
            item.returnedDate = fmtDate(new Date());

            const books = getDB(STORAGE_KEY_BOOKS, defaultBooks);
            const book = books.find(b => b.code === item.codeBuku);
            if (book) {
                book.stock += 1;
                saveDB(STORAGE_KEY_BOOKS, books);
            }

            const history = getDB(STORAGE_KEY_HISTORY, []);
            history.unshift({ ...item, status: 'Dikembalikan' });
            saveDB(STORAGE_KEY_HISTORY, history);

            borrowings.splice(idx, 1);
            saveDB(STORAGE_KEY_BORROW, borrowings);

            showModal('Berhasil', 'Buku berhasil dikembalikan. Terima kasih!', 'success', () => {
                renderStudentDashboard('return');
            });
        }

        function renewBook(borrowId) {
            const borrowings = getDB(STORAGE_KEY_BORROW, []);
            const item = borrowings.find(b => b.id === borrowId);
            if (!item) return;

            if (item.renewCount >= 2) {
                showModal('Batas Perpanjangan', 'Buku ini sudah mencapai batas maksimal perpanjangan (2x).', 'error');
                return;
            }

            const today = new Date();
            today.setHours(0,0,0,0);
            const due = parseDate(item.dueDate);
            due.setHours(0,0,0,0);
            if (due < today) {
                showModal('Tidak Dapat Diperpanjang', 'Buku sudah melewati batas jatuh tempo (telat).', 'error');
                return;
            }

            showModal('Konfirmasi Perpanjangan', 'Perpanjangan akan menambah 7 hari dari tanggal jatuh tempo saat ini. Lanjutkan?', 'info', () => {
                const newDue = parseDate(item.dueDate);
                newDue.setDate(newDue.getDate() + 7);
                item.dueDate = fmtDate(newDue);
                item.renewCount = (item.renewCount || 0) + 1;

                saveDB(STORAGE_KEY_BORROW, borrowings);
                showModal('Berhasil Diperpanjang', `Masa pinjam diperpanjang hingga ${item.dueDate} (Perpanjangan ke-${item.renewCount})`, 'success', () => {
                    renderStudentDashboard('return');
                });
            });
        }

        let uploadedBase64Photo = '';

        function downloadTemplate() {
            const templateData = [
                ['Judul Buku', 'Pengarang', 'Kategori Buku', 'Stok'],
                ['Laskar Pelangi', 'Andrea Hirata', 'Fiksi', 5],
                ['Matematika Kelas X', 'Sutrisno', 'Pelajaran', 4],
                ['Sapiens', 'Yuval Noah Harari', 'Non-Fiksi', 3],
                ['Kamus Besar Bahasa Indonesia', 'Kemendikbud', 'Referensi', 6],
                ['Majalah Bobo Edisi 2024', 'Kompas', 'Majalah', 2],
                ['Buku Tulis Sekolah', 'Admin', '', 10]
            ];
            
            const ws = XLSX.utils.aoa_to_sheet(templateData);
            ws['!cols'] = [{ wch: 30 }, { wch: 25 }, { wch: 20 }, { wch: 10 }];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Data Buku');
            
            const panduanData = [
                ['📖 PANDUAN IMPORT BUKU'],
                [''],
                ['1. Isi kolom sesuai header: Judul Buku, Pengarang, Kategori Buku, Stok'],
                ['2. Kolom "Kategori Buku" boleh dikosongkan (otomatis jadi Buku Pelajaran)'],
                ['3. Kategori yang valid:'],
                ['   - Pelajaran (atau Buku Pelajaran)'],
                ['   - Fiksi (atau Buku Fiksi)'],
                ['   - Non-Fiksi (atau Buku Non-Fiksi)'],
                ['   - Referensi (atau Buku Referensi)'],
                ['   - Majalah (atau Majalah & Jurnal)'],
                ['4. Kolom Stok harus berupa ANGKA (bukan teks)'],
                ['5. Jangan hapus baris header (baris pertama)'],
                ['6. Format file: .xlsx, .xls']
            ];
            
            const wsPanduan = XLSX.utils.aoa_to_sheet(panduanData);
            wsPanduan['!cols'] = [{ wch: 70 }];
            XLSX.utils.book_append_sheet(wb, wsPanduan, '📖 Panduan');
            
            XLSX.writeFile(wb, 'template_import_buku.xlsx');

        function triggerFileInput() {
            document.getElementById('fotoInput').click();

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadArea').classList.add('border-indigo-600', 'bg-indigo-50/40');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadArea').classList.remove('border-indigo-600', 'bg-indigo-50/40');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadArea').classList.remove('border-indigo-600', 'bg-indigo-50/40');
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                processImageFile(files[0]);
            }
        }

        function handleFileSelected(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                processImageFile(files[0]);
            }
        }

        function processImageFile(file) {
            const validTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                showModal('Format Tidak Didukung', 'Format file tidak didukung! Gunakan PNG, JPG, JPEG, atau WEBP.', 'error');
                return;
            }

            const maxSize = 15 * 1024 * 1024;
            if (file.size > maxSize) {
                showModal('Ukuran Terlalu Besar', 'Ukuran file melebihi batas maksimal 15MB.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const MAX = 400;
                    const ratio = Math.min(1, MAX / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * ratio);
                    canvas.height = Math.round(img.height * ratio);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    uploadedBase64Photo = canvas.toDataURL('image/jpeg', 0.75);
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('uploadPreview').classList.remove('hidden');
                    document.getElementById('previewImg').src = uploadedBase64Photo;
                    document.getElementById('fileName').innerText = file.name;
                    document.getElementById('fileSize').innerText = `${(uploadedBase64Photo.length * 0.75 / 1024).toFixed(0)} KB (sudah dikompres)`;
                };
                img.onerror = function() { showModal('Gagal', 'Gambar tidak dapat dibaca. Coba file lain.', 'error'); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function hapusFoto() {
            uploadedBase64Photo = '';
            document.getElementById('fotoInput').value = '';
            document.getElementById('uploadPreview').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
        }

        function openBookModal(code = '') {
            const modal = document.getElementById('book-modal');
            modal.classList.remove('hidden');
            hapusFoto();

            if (code) {
                document.getElementById('book-modal-title').innerText = 'Edit Buku';
                const books = getDB(STORAGE_KEY_BOOKS, defaultBooks);
                const b = books.find(x => x.code === code);
                if (b) {
                    document.getElementById('book-edit-code').value = b.code;
                    document.getElementById('book-code').value = b.code;
                    document.getElementById('book-code').disabled = true;
                    document.getElementById('book-title').value = b.title;
                    document.getElementById('book-author').value = b.author;
                    document.getElementById('book-category').value = b.category;
                    document.getElementById('book-stock').value = b.stock;

                    if (b.photo) {
                        uploadedBase64Photo = b.photo;
                        document.getElementById('uploadPlaceholder').classList.add('hidden');
                        document.getElementById('uploadPreview').classList.remove('hidden');
                        document.getElementById('previewImg').src = b.photo;
                        document.getElementById('fileName').innerText = 'Sampul Buku Tersimpan';
                        document.getElementById('fileSize').innerText = '';
                    }
                }
            } else {
                document.getElementById('book-modal-title').innerText = 'Tambah Buku Baru';
                document.getElementById('book-form').reset();
                document.getElementById('book-edit-code').value = '';
                document.getElementById('book-code').disabled = false;
            }
        }

        function closeBookModal() {
            document.getElementById('book-modal').classList.add('hidden');
        }

        function saveBookForm(e) {
            e.preventDefault();
            const editCode = document.getElementById('book-edit-code').value;
            const code = document.getElementById('book-code').value.trim();
            const title = document.getElementById('book-title').value.trim();
            const author = document.getElementById('book-author').value.trim();
            const category = document.getElementById('book-category').value;
            const stock = parseInt(document.getElementById('book-stock').value) || 0;

            const books = getDB(STORAGE_KEY_BOOKS, defaultBooks);

            if (!editCode && books.some(b => b.code === code)) {
                showModal('Gagal', 'Kode buku sudah terdaftar dalam sistem.', 'error');
                return;
            }

            const photoUrl = uploadedBase64Photo || '';

            if (editCode) {
                const idx = books.findIndex(b => b.code === editCode);
                if (idx !== -1) {
                    books[idx] = { ...books[idx], title, author, category, stock, photo: photoUrl };
                }
            } else {
                books.push({ code, title, author, category, stock, photo: photoUrl });
            }

            saveDB(STORAGE_KEY_BOOKS, books);
            closeBookModal();
            showModal('Berhasil', 'Data buku berhasil disimpan.', 'success', () => {
                renderAdminTab('books');
            });
        }

        function deleteBook(code) {
            showModal('Konfirmasi Hapus', 'Apakah Anda yakin ingin menghapus buku ini dari katalog?', 'info', () => {
                let books = getDB(STORAGE_KEY_BOOKS, defaultBooks);
                books = books.filter(b => b.code !== code);
                saveDB(STORAGE_KEY_BOOKS, books);
                showModal('Terhapus', 'Buku berhasil dihapus dari katalog.', 'success', () => {
                    renderAdminTab('books');
                });
            });
        }

        function resetDefaultBooks() {
            showModal('Reset Katalog', 'Kembalikan daftar buku ke default?', 'info', () => {
                saveDB(STORAGE_KEY_BOOKS, defaultBooks);
                renderAdminTab('books');
                showModal('Berhasil', 'Katalog buku telah direset.', 'success');
            });
        }

        function openImportModal() {
            document.getElementById('import-modal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('import-modal').classList.add('hidden');
        }

        function processExcelImport() {
            const fileInput = document.getElementById('excel-file-input');
            if (!fileInput.files || fileInput.files.length === 0) {
                showModal('Pilih File', 'Silakan pilih file Excel terlebih dahulu.', 'error');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (!json || json.length === 0) {
                        showModal('Import Gagal', 'File Excel kosong atau format tidak sesuai.', 'error');
                        return;
                    }

                    const books = getDB(STORAGE_KEY_BOOKS, defaultBooks);
                    let count = 0;

                    json.forEach(row => {
                        const title = String(row.title || row.Judul || row['Judul Buku'] || '').trim();
                        const author = String(row.author || row.Penulis || row['Pengarang'] || '').trim();
                        let category = String(row.category || row.Kategori || row['Kategori Buku'] || '').trim();
                        let stock = parseInt(row.stock ?? row.Stok); if (isNaN(stock) || stock < 0) stock = 5;

                        if (!category) {
                            category = 'Buku Pelajaran';
                        } else {
                            const lowerCat = category.toLowerCase();
                            if (lowerCat.includes('fiksi') && !lowerCat.includes('non')) category = 'Buku Fiksi';
                            else if (lowerCat.includes('non') || lowerCat.includes('biografi') || lowerCat.includes('sejarah')) category = 'Buku Non-Fiksi';
                            else if (lowerCat.includes('referensi') || lowerCat.includes('kamus') || lowerCat.includes('ensiklopedia')) category = 'Buku Referensi';
                            else if (lowerCat.includes('majalah') || lowerCat.includes('jurnal') || lowerCat.includes('koran')) category = 'Majalah & Jurnal';
                            else category = 'Buku Pelajaran';
                        }

                        if (title) {
                            let n = books.length + 1; let code; do { code = 'BK' + String(n++).padStart(3, '0'); } while (books.some(x => x.code === code));
                            books.push({ code, title, author, category, stock, photo: '' });
                            count++;
                        }
                    });

                    saveDB(STORAGE_KEY_BOOKS, books);
                    closeImportModal();
                    showModal('Import Berhasil', `Berhasil mengimpor ${count} buku ke dalam sistem.`, 'success', () => {
                        renderAdminTab('books');
                    });
                } catch(err) {
                    showModal('Error', 'Gagal memproses file Excel: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

                                      history.map(h => `
                                          <tr class="hover:bg-slate-50 transition">
                                              <td class="py-3 px-3 font-medium text-slate-900">${esc(h.studentName)}<br><span class="text-xs text-slate-400 font-mono">${esc(h.nisn)}</span></td>
                                              <td class="py-3 px-3 text-slate-800">${esc(h.judulBuku)}</td>
                                              <td class="py-3 px-3 text-slate-600">${h.tglPinjam}</td>
                                              <td class="py-3 px-3 text-slate-600">${h.returnedDate || '-'}</td>
                                              <td class="py-3 px-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700">${h.status}</span></td>
                                          </tr>
                                      `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminStudents(container) {
            const students = getDB(STORAGE_KEY_USERS, defaultUsers);
            container.innerHTML = `
                <div class="max-w-6xl mx-auto space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-slate-900">Kelola Data Siswa Terdaftar</h3>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-400">
                                        <th class="pb-3 px-3">NISN</th>
                                        <th class="pb-3 px-3">Nama Lengkap</th>
                                        <th class="pb-3 px-3">Kelas</th>
                                        <th class="pb-3 px-3">Tanggal Lahir</th>
                                        <th class="pb-3 px-3 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${students.map(s => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="py-3 px-3 font-mono font-bold text-slate-800">${esc(s.nisn)}</td>
                                            <td class="py-3 px-3 font-semibold text-slate-900">${esc(s.name)}</td>
                                            <td class="py-3 px-3"><span class="px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700">${esc(s.kelas)}</span></td>
                                            <td class="py-3 px-3 text-slate-600">${s.tglLahir || '-'}</td>
                                            <td class="py-3 px-3 text-right sticky right-0 bg-white">
                                                <button onclick="deleteStudent('${s.nisn}')" class="p-2 bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 rounded-xl transition" title="Hapus Akun Siswa"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function deleteStudent(nisn) {
            showModal('Konfirmasi Hapus Akun', `Hapus siswa dengan NISN ${nisn}?`, 'info', () => {
                let students = getDB(STORAGE_KEY_USERS, defaultUsers);
                students = students.filter(s => s.nisn !== nisn);
                saveDB(STORAGE_KEY_USERS, students);
                showModal('Berhasil', 'Akun siswa berhasil dihapus.', 'success', () => {
                    renderAdminTab('students');
                });
            });
        }

        window.onload = function() {
            const session = getCurrentSession();
            if (session) {
                if (session.role === 'admin') renderAdminDashboard();
                else renderStudentDashboard();
            } else {
                renderLogin();
            }
        };
    </script>
</body>
</html>
